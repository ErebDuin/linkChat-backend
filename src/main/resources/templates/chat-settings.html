<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon"/>
    <link rel="stylesheet" th:href="@{/styles/secondary-ui.css}"/>
    <link rel="stylesheet" th:href="@{/styles/buttons.css}"/>
    <title>Chat Settings</title>
</head>
<body>
<main layout:fragment="content" class="main">
    <div class="main-container">
        <h1>Chat Settings</h1>
        <form th:action="@{/ui/chat-settings/save}" th:object="${chatSettingsDto}" method="post">
            <input type="hidden" th:field="*{id}" />
            <div class="field-box">
                <label>Name</label>
                <input type="text" th:field="*{title}" required>
            </div>
            <div class="field-box">
                <label>Link</label>
                <input type="text" th:field="*{link}" readonly>
            </div>
            <div class="field-box">
                <label>Type</label>
                <select th:field="*{type}" required>
                    <option value="" disabled hidden>Select type</option>
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                </select>
            </div>
            <div class="field-box">
                <label>Active</label>
                <input type="checkbox" th:field="*{active}">
            </div>
            <div class="field-box">
                <input type="hidden" th:field="*{id}" />
                <button type="submit" name="save" class="action-button primary">Save</button>

                <form th:action="@{/ui/chat-settings/delete}" method="post" th:object="${chatSettingsDto}" style="margin: 0;">
                    <input type="hidden" th:field="*{id}" />
                    <button type="submit" name="delete" class="action-button danger" onclick="return confirm('Are you sure you want to delete this chat?')">Delete</button>
                </form>
                <button type="button" name="cancel" class="action-button danger"
                        th:onclick="'window.location.href=\'' + @{/ui/chats-management} + '\''">Cancel</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
